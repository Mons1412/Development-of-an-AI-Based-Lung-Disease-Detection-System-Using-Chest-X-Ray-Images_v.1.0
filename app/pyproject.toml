[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lung-xray-ai-inference"
version = "1.2.0"
description = "FastAPI inference service for Lung X-ray AI Phase 03 integrated local analysis workspace."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "python-multipart>=0.0.20,<1.0",
    "jinja2>=3.1,<4.0",
    "numpy==2.0.2",
    "Pillow==11.3.0",
    "reportlab>=4.2,<5.0",
    "google-genai==2.14.0",
    "tensorflow==2.20.0",
    "keras==3.13.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
    "pytest-cov>=5.0,<7.0",
    "pyright>=1.1,<2.0",
    "ruff>=0.6,<1.0",
]

[project.scripts]
lung-xray-api = "lung_xray_api.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["lung_xray_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
